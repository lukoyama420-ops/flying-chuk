// Звуки
const AC = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if (type === 'jump') {
      o.frequency.setValueAtTime(300, AC.currentTime);
      o.frequency.exponentialRampToValueAtTime(500, AC.currentTime + 0.1);
      g.gain.setValueAtTime(0.12, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.15);
      o.start(); o.stop(AC.currentTime + 0.15);
    } else if (type === 'score') {
      o.type = 'sine';
      o.frequency.setValueAtTime(520, AC.currentTime);
      o.frequency.exponentialRampToValueAtTime(880, AC.currentTime + 0.12);
      g.gain.setValueAtTime(0.13, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.2);
      o.start(); o.stop(AC.currentTime + 0.2);
    } else if (type === 'die') {
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(350, AC.currentTime);
      o.frequency.exponentialRampToValueAtTime(60, AC.currentTime + 0.5);
      g.gain.setValueAtTime(0.18, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.5);
      o.start(); o.stop(AC.currentTime + 0.5);
    } else if (type === 'bonus') {
      o.type = 'sine';
      [523,659,784,1047].forEach((f,i) => {
        const o2 = AC.createOscillator(), g2 = AC.createGain();
        o2.connect(g2); g2.connect(AC.destination);
        o2.frequency.value = f;
        g2.gain.setValueAtTime(0.1, AC.currentTime + i*0.08);
        g2.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + i*0.08 + 0.15);
        o2.start(AC.currentTime + i*0.08);
        o2.stop(AC.currentTime + i*0.08 + 0.15);
      });
      return;
    } else if (type === 'shield') {
      o.type = 'sine';
      o.frequency.setValueAtTime(200, AC.currentTime);
      o.frequency.exponentialRampToValueAtTime(600, AC.currentTime + 0.3);
      g.gain.setValueAtTime(0.12, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.3);
      o.start(); o.stop(AC.currentTime + 0.3);
    }
  } catch(e) {}
}

// Фоновая музыка — реальный трек
let musicOn = false;
let bgAudio = null;

function startMusic() {
  if (bgAudio) { bgAudio.play().catch(()=>{}); return; }
  bgAudio = new Audio('music.mp3');
  bgAudio.loop = true;
  bgAudio.volume = 0.5;
  bgAudio.play().catch(()=>{});
  musicOn = true;
}

function stopMusic() {
  if (bgAudio) { bgAudio.pause(); bgAudio.currentTime = 0; }
  musicOn = false;
}

// Огненные частицы

let fireParticles = [];
let scoreFire = 0; // сколько кадров горит огонь

function spawnExplosion(x, y) {
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 6;
    explosions.push({
      x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1, size: 4+Math.random()*8,
      color: `hsl(${Math.random()*60},100%,60%)`
    });
  }
}

function spawnConfetti() {
  for (let i = 0; i < 60; i++) {
    confetti.push({
      x: Math.random() * BASE_W,
      y: -10,
      vx: (Math.random()-0.5)*4,
      vy: 2+Math.random()*4,
      life: 1,
      size: 5+Math.random()*8,
      color: `hsl(${Math.random()*360},90%,60%)`,
      rot: Math.random()*Math.PI*2,
      rotV: (Math.random()-0.5)*0.3
    });
  }
}

function drawExplosions() {
  explosions.forEach(p => {
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.025; p.size*=0.96;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  explosions = explosions.filter(p=>p.life>0);
}

function drawConfetti() {
  confetti.forEach(p => {
    p.x+=p.vx; p.y+=p.vy; p.life-=0.008; p.rot+=p.rotV;
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.5);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
  confetti = confetti.filter(p=>p.life>0 && p.y<BASE_H+20);
}

function drawShield() {
  if (shieldCooldown <= 0) return;
  // Мигаем в начале игры показывая неуязвимость
  if (Math.floor(frame / 8) % 2 === 0) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(100,200,255,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(80, by, 28, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function spawnFire() {
  scoreFire = 60; // горит 60 кадров
  for (let i = 0; i < 25; i++) {
    fireParticles.push({
      x: BASE_W/2 + (Math.random()-0.5)*80,
      y: 45 + Math.random()*20,
      vx: (Math.random()-0.5)*3,
      vy: -(1.5+Math.random()*3),
      life: 1,
      size: 6+Math.random()*12,
      hue: Math.random()*40 // оттенок: красный/оранжевый/жёлтый
    });
  }
}

function updateFire() {
  fireParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= 0.03;
    p.size *= 0.96;
  });
  fireParticles = fireParticles.filter(p => p.life > 0);
  if (scoreFire > 0) scoreFire--;
}

function drawFire() {
  fireParticles.forEach(p => {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
    g.addColorStop(0, `hsla(${50+p.hue},100%,90%,${p.life})`);
    g.addColorStop(0.4, `hsla(${30+p.hue},100%,60%,${p.life*0.8})`);
    g.addColorStop(1, `hsla(${p.hue},100%,40%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  });
}

function initGame() {
  by = BASE_H / 2;
  bvy = 0;
  score = 0;
  pipes = [];
  bonusPipes = [];
  lastSpawn = 0;
  frame = 0;
  speed = 1.0;
  shieldCooldown = 180; // 3 секунды неуязвимости в начале
  confetti = [];
  explosions = [];
  isNewRecord = false;
  fireParticles = [];
  scoreFire = 0;
}

function spawnPipe(ts) {
  // topH = высота верхней бутылки (от 0 до topH)
  // нижняя бутылка начинается с topH + PIPE_GAP
  const minTop = 80;
  const maxTop = BASE_H - 80 - PIPE_GAP;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: BASE_W + 20, topH, passed: false });
  lastSpawn = ts;
}

function jump() {
  if (AC.state === 'suspended') AC.resume();
  if (state === 'idle' || state === 'dead') {
    initGame();
    state = 'play';
    bvy = JUMP_VEL;
    startMusic();
  } else if (state === 'play') {
    bvy = JUMP_VEL;
    playSound('jump');
  }
}

// Рисуем верхнюю бутылку (перевёрнутая, горлышко вниз)
function drawTopBottle(x, h) {
  if (h <= 0) return;
  ctx.save();
  // Переворачиваем: рисуем как нижнюю, но отражаем
  ctx.translate(x + PIPE_W/2, h);
  ctx.scale(1, -1);
  ctx.translate(-x - PIPE_W/2, 0);
  drawBottleShape(x, 0, h);
  ctx.restore();
}

// Рисуем нижнюю бутылку (нормальная, горлышко вверх)
function drawBottomBottle(x, startY) {
  const h = BASE_H - startY - 50; // до пола
  if (h <= 0) return;
  drawBottleShape(x, startY, h);
}

function drawBottleShape(x, y, h) {
  const w = PIPE_W;

  // Тело
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, 'rgba(40,150,230,0.5)');
  g.addColorStop(0.3, 'rgba(150,225,255,0.78)');
  g.addColorStop(0.65, 'rgba(80,185,255,0.68)');
  g.addColorStop(1, 'rgba(30,120,210,0.52)');
  ctx.fillStyle = g;
  ctx.strokeStyle = 'rgba(120,215,255,0.75)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(x + 3, y, w - 6, h, [3, 3, 0, 0]);
  ctx.fill();
  ctx.stroke();

  // Блик
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.fillRect(x + 9, y + 5, 9, Math.min(h - 10, 70));

  // Этикетка
  if (h > 90) {
    const ly = y + h * 0.22;
    const lh = h * 0.42;
    ctx.fillStyle = 'rgba(0,75,195,0.88)';
    ctx.beginPath();
    ctx.roundRect(x + 3, ly, w - 6, lh, 3);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = `bold ${Math.min(11, lh * 0.28)}px Arial`;
    ctx.fillText('AQUA', x + w / 2, ly + lh * 0.38);
    if (lh > 45) {
      ctx.font = `${Math.min(9, lh * 0.2)}px Arial`;
      ctx.fillStyle = 'rgba(180,225,255,0.85)';
      ctx.fillText('0.5 L', x + w / 2, ly + lh * 0.65);
    }
  }

  // Горлышко
  const nw = w * 0.44;
  const nx = x + (w - nw) / 2;
  ctx.fillStyle = 'rgba(70,165,240,0.65)';
  ctx.strokeStyle = 'rgba(120,215,255,0.75)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(nx, y - 20, nw, 22, [4, 4, 0, 0]);
  ctx.fill();
  ctx.stroke();

  // Крышка
  const cw = nw + 7;
  const cx = x + (w - cw) / 2;
  ctx.fillStyle = '#dd2800';
  ctx.beginPath();
  ctx.roundRect(cx, y - 33, cw, 15, [4, 4, 2, 2]);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(cx + 4, y - 31, cw * 0.38, 6);
}

function drawBg() {
  // Фоновая картинка
  if (bgImg.complete && bgImg.naturalWidth > 0) {
    ctx.drawImage(bgImg, 0, 0, BASE_W, BASE_H);
  } else {
    ctx.fillStyle = '#0e0e2e';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }

  // Тёмный оверлей снизу для пола
  const floorGrad = ctx.createLinearGradient(0, BASE_H - 80, 0, BASE_H);
  floorGrad.addColorStop(0, 'rgba(0,0,15,0)');
  floorGrad.addColorStop(1, 'rgba(0,0,15,0.9)');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, BASE_H - 80, BASE_W, 80);

  // Пол
  ctx.fillStyle = 'rgba(0,0,20,0.85)';
  ctx.fillRect(0, BASE_H - 50, BASE_W, 50);
  ctx.fillStyle = 'rgba(30,20,60,0.9)';
  ctx.fillRect(0, BASE_H - 50, BASE_W, 6);
}

function drawChuk() {
  ctx.save();
  ctx.translate(80, by);
  const rot = Math.max(-0.45, Math.min(0.65, bvy * 0.055));
  ctx.rotate(rot);
  if (birdImg.complete && birdImg.naturalWidth > 0) {
    ctx.drawImage(birdImg, -22, -20, 44, 40);
  } else {
    ctx.fillStyle = '#4a9a4a';
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function checkCollision() {
  // Только центральная точка птицы
  const bx = 80;
  const byo = by;

  if (byo > BASE_H - 60) return true;
  if (byo < 5) return true;

  for (const p of pipes) {
    const inX = bx > p.x + 10 && bx < p.x + PIPE_W - 10;
    if (inX) {
      if (byo < p.topH - 8) return true;         // выше верхней бутылки
      if (byo > p.topH + PIPE_GAP + 8) return true; // ниже нижней бутылки
    }
  }
  return false;
}

function drawScore() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px Arial';

  if (scoreFire > 0) {
    // Огненный текст!
    const t = scoreFire / 60;
    // Тень/свечение
    ctx.shadowColor = `rgba(255,${Math.floor(100+t*100)},0,${t})`;
    ctx.shadowBlur = 20 * t;

    // Градиентный текст
    const grad = ctx.createLinearGradient(BASE_W/2-30, 25, BASE_W/2+30, 60);
    grad.addColorStop(0, `rgba(255,255,${Math.floor(200*t)},1)`);
    grad.addColorStop(0.4, `rgba(255,${Math.floor(150+100*t)},0,1)`);
    grad.addColorStop(1, `rgba(220,30,0,1)`);

    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 4;
    ctx.strokeText(score, BASE_W/2, 55);
    ctx.fillStyle = grad;
    ctx.fillText(score, BASE_W/2, 55);
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
  } else {
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 3;
    ctx.strokeText(score, BASE_W/2, 55);
    ctx.fillStyle = '#fff';
    ctx.fillText(score, BASE_W/2, 55);
  }
}

function drawIdle() {
  // Градиентный оверлей
  const grad = ctx.createLinearGradient(0, 0, 0, BASE_H);
  grad.addColorStop(0, 'rgba(8,8,28,0.7)');
  grad.addColorStop(0.5, 'rgba(8,8,28,0.4)');
  grad.addColorStop(1, 'rgba(8,8,28,0.75)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  const cx = BASE_W / 2;

  // Заголовок FLYING
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px Arial';
  ctx.shadowColor = 'rgba(100,180,255,0.3)';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('FLYING', cx, BASE_H/2 - 70);

  // CHUK жёлтый с свечением
  ctx.shadowColor = 'rgba(245,200,66,0.6)';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#f5c842';
  ctx.fillText('CHUK', cx, BASE_H/2 - 10);
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';

  // Подзаголовок
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '13px Arial';
  ctx.letterSpacing = '2px';
  ctx.fillText('УВОРАЧИВАЙСЯ ОТ БУТЫЛОК', cx, BASE_H/2 + 25);

  // Анимированный тап хинт
  const pulse = Math.sin(frame * 0.06) * 0.3 + 0.7;
  ctx.fillStyle = `rgba(255,255,255,${pulse * 0.6})`;
  ctx.font = 'bold 14px Arial';
  ctx.fillText('ТАП ЧТОБЫ НАЧАТЬ', cx, BASE_H/2 + 65);

  // Рекорд
  if (best > 0) {
    ctx.fillStyle = 'rgba(245,200,66,0.85)';
    ctx.font = 'bold 14px Arial';
    ctx.fillText('🏆 РЕКОРД: ' + best, cx, BASE_H/2 + 95);
  }
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,20,0.6)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  ctx.fillStyle = 'rgba(15,15,45,0.96)';
  const cx = BASE_W / 2, cy = BASE_H / 2;
  ctx.beginPath();
  ctx.roundRect(cx - 120, cy - 100, 240, 215, 18);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '12px Arial';
  ctx.fillText('СЧЁТ', cx, cy - 62);

  ctx.font = 'bold 52px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText(score, cx, cy - 15);

  if (score > 0 && score >= best) {
    ctx.fillStyle = '#f5c842';
    ctx.font = 'bold 13px Arial';
    ctx.fillText('🏆 НОВЫЙ РЕКОРД!', cx, cy + 20);
  } else {
    ctx.fillStyle = '#f5c842';
    ctx.font = '13px Arial';
    ctx.fillText('РЕКОРД: ' + best, cx, cy + 20);
  }

  const msgs = ['НУ И ЛАДНО 😐', 'БУТЫЛКА ПОБЕДИЛА 🍾', 'КАК ОБЫЧНО 😒', 'ДОМОЙ ХОТЕЛ 🛏️', 'НЕ СУДЬБА 😤'];
  ctx.fillStyle = 'rgba(255,130,130,0.9)';
  ctx.font = '12px Arial';
  ctx.fillText(msgs[score % msgs.length], cx, cy + 48);

  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.font = '13px Arial';
  ctx.fillText('ТАП ДЛЯ РЕВАНША', cx, cy + 80);
}

function loop(ts) {
  frame++;
  ctx.clearRect(0, 0, BASE_W, BASE_H); // DPR handled by transform
  drawBg();

  if (state === 'play') {
    // Физика птицы
    bvy += GRAV;
    by += bvy;

    // Спавн бутылок
    if (ts - lastSpawn > PIPE_SPAWN) {
      spawnPipe(ts);
    }

    // Двигаем бутылки
    for (const p of pipes) p.x -= PIPE_VEL * speed;
    pipes = pipes.filter(p => p.x > -PIPE_W - 30);

    // Очки
    for (const p of pipes) {
      if (!p.passed && p.x + PIPE_W < 80) {
        p.passed = true;
        score++;
        spawnFire();
        playSound('score');
        speed = 1.0 + score * 0.03; // ускорение
        if (score > best) {
          best = score;
          localStorage.setItem('chuk_best', best);
          isNewRecord = true;
          spawnConfetti();
        }
      }
    }

    // Коллизия
    if (shieldCooldown > 0) {
      shieldCooldown--;
    } else if (checkCollision()) {
      state = 'dead';
      spawnExplosion(80, by);
      playSound('die');
    }

    // Огонь
    updateFire();
  } else if (state === 'idle') {
    by = BASE_H / 2 + Math.sin(ts * 0.003) * 12;
  }

  // Рисуем бутылки
  for (const p of pipes) {
    drawTopBottle(p.x, p.topH);           // верхняя (перевёрнутая)
    drawBottomBottle(p.x, p.topH + PIPE_GAP); // нижняя (нормальная)
  }

  // Рисуем птицу
  drawChuk();

  drawExplosions();
  drawConfetti();
  if (state === 'play') {
    drawShield();
    drawFire();
    drawScore();

    // Иконка скорости
    if (speed > 1.3) {
      ctx.fillStyle = '#ff6644';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'right';
      ctx.fillText('⚡ x' + speed.toFixed(1), BASE_W-12, 55);
    }
  }
  if (state === 'idle') drawIdle();
  if (state === 'dead') drawDead();

  requestAnimationFrame(loop);
}

// Тап / клик на весь экран
document.addEventListener('touchstart', e => {
  e.preventDefault();
  jump();
}, { passive: false });
document.addEventListener('click', jump);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});

initGame();
requestAnimationFrame(loop);
</script>
