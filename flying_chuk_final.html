<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLYING CHUK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a0a1e}
  body{display:flex;justify-content:center;align-items:center;font-family:'Unbounded',sans-serif}
  .wrap{width:100vw;max-width:430px;height:100vh;max-height:900px;position:relative;overflow:hidden}
  .ui-top{position:absolute;top:0;left:0;right:0;z-index:10;background:linear-gradient(180deg,rgba(10,10,30,0.95) 0%,rgba(10,10,30,0) 100%);padding:12px 20px 24px;display:flex;justify-content:space-between;align-items:flex-start}
  .score-box{text-align:center}
  .slbl{font-size:8px;letter-spacing:0.15em;color:rgba(255,255,255,0.4);margin-bottom:2px;text-transform:uppercase}
  .snum{font-size:28px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 20px rgba(100,200,255,0.5)}
  .bnum{font-size:18px;font-weight:700;color:#f5c842;text-shadow:0 0 10px rgba(245,200,66,0.4)}
  .game-title{font-size:9px;font-weight:900;color:rgba(245,200,66,0.6);letter-spacing:0.12em;text-align:center;line-height:1.4}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* OVERLAY */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity 0.4s;z-index:20}
  .overlay.hidden{opacity:0}
  .overlay-bg{position:absolute;inset:0;background:rgba(5,5,20,0.7);backdrop-filter:blur(4px)}

  /* START SCREEN */
  .start-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0}
  .game-logo{font-size:42px;font-weight:900;color:#fff;text-align:center;line-height:1;letter-spacing:-0.02em;text-shadow:0 4px 30px rgba(100,200,255,0.3)}
  .game-logo span{color:#f5c842;display:block}
  .logo-sub{font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:0.15em;margin-top:8px;margin-bottom:32px}
  .tap-btn{background:linear-gradient(135deg,#f5c842,#ff8c00);color:#0a0a1e;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:900;letter-spacing:0.08em;border:none;border-radius:50px;padding:16px 40px;cursor:pointer;box-shadow:0 8px 30px rgba(245,200,66,0.4);animation:pulse-btn 1.5s ease-in-out infinite;pointer-events:all}
  @keyframes pulse-btn{0%,100%{transform:scale(1);box-shadow:0 8px 30px rgba(245,200,66,0.4)}50%{transform:scale(1.05);box-shadow:0 12px 40px rgba(245,200,66,0.6)}}

  /* DEATH SCREEN */
  .death-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;width:85%;max-width:300px}
  .death-card{background:rgba(15,15,40,0.95);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:28px 24px;width:100%;text-align:center}
  .death-title{font-size:11px;letter-spacing:0.15em;color:rgba(255,255,255,0.4);margin-bottom:6px}
  .death-score{font-size:56px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 30px rgba(100,200,255,0.4)}
  .death-record{font-size:11px;color:#f5c842;margin-top:4px;letter-spacing:0.1em}
  .death-msg{font-size:12px;color:rgba(255,150,150,0.9);margin-top:16px;line-height:1.5;font-family:sans-serif}
  .scores-list{width:100%;background:rgba(15,15,40,0.95);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px 20px}
  .scores-title{font-size:9px;letter-spacing:0.15em;color:rgba(255,255,255,0.35);margin-bottom:12px;text-align:center}
  .score-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
  .score-row:last-child{border-bottom:none}
  .score-rank{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0}
  .r1{background:#f5c842;color:#0a0a1e}
  .r2{background:#aaa;color:#0a0a1e}
  .r3{background:#cd7f32;color:#fff}
  .rn{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5)}
  .score-val{flex:1;font-size:16px;font-weight:700;color:#fff}
  .score-date{font-size:9px;color:rgba(255,255,255,0.3);font-family:sans-serif}
  .share-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;border-radius:16px;padding:12px 24px;cursor:pointer;pointer-events:all;letter-spacing:0.05em;width:100%}
  .retry-btn{background:linear-gradient(135deg,#f5c842,#ff8c00);color:#0a0a1e;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:900;letter-spacing:0.08em;border:none;border-radius:50px;padding:16px 40px;cursor:pointer;pointer-events:all;width:100%;box-shadow:0 8px 30px rgba(245,200,66,0.3)}

  /* SCORE POPUP */
  .score-popup{position:absolute;top:80px;left:50%;transform:translateX(-50%);font-family:'Unbounded',sans-serif;font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 20px rgba(100,200,255,0.8);pointer-events:none;z-index:30;opacity:0;transition:none}
</style>
</head>

<div class="wrap">
  <div class="ui-top">
    <div class="score-box"><div class="slbl">СЧЁТ</div><div class="snum" id="sd">0</div></div>
    <div class="game-title">FLYING<br>CHUK</div>
    <div class="score-box" style="text-align:right"><div class="slbl">РЕКОРД</div><div class="bnum" id="bd">0</div></div>
  </div>

  <canvas id="c"></canvas>

  <!-- START -->
  <div class="overlay" id="ov-start">
    <div class="overlay-bg"></div>
    <div class="start-content">
      <div class="game-logo">FLYING<span>CHUK</span></div>
      <div class="logo-sub">УВОРАЧИВАЙСЯ ОТ БУТЫЛОК</div>
      <button class="tap-btn" onclick="startGame()">ПОЛЕТЕЛИ 🚀</button>
    </div>
  </div>

  <!-- DEATH -->
  <div class="overlay hidden" id="ov-death">
    <div class="overlay-bg"></div>
    <div class="death-content">
      <div class="death-card">
        <div class="death-title">ТВОЙ СЧЁТ</div>
        <div class="death-score" id="final-score">0</div>
        <div class="death-record" id="death-record"></div>
        <div class="death-msg" id="death-msg"></div>
      </div>
      <div class="scores-list" id="scores-list"></div>
      <button class="share-btn" onclick="shareScore()">ПОДЕЛИТЬСЯ 📤</button>
      <button class="retry-btn" onclick="startGame()">ЕЩЁ РАЗ 🔄</button>
    </div>
  </div>

  <div class="score-popup" id="score-popup"></div>
</div>

<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const wrap=document.querySelector('.wrap');

// Размеры — подстраиваемся под экран
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const rect = wrap.getBoundingClientRect();
  cv.width = rect.width * dpr;
  cv.height = rect.height * dpr;
  cv.style.width = rect.width + 'px';
  cv.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);
}
resize();
window.addEventListener('resize',()=>{resize();});

const W=()=>cv.width, H=()=>cv.height;

// Звуки через Web Audio API
const AC=new (window.AudioContext||window.webkitAudioContext)();
function playSound(type){
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    if(type==='jump'){o.frequency.setValueAtTime(400,AC.currentTime);o.frequency.exponentialRampToValueAtTime(600,AC.currentTime+0.1);g.gain.setValueAtTime(0.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.15);o.start();o.stop(AC.currentTime+0.15);}
    else if(type==='score'){o.type='sine';o.frequency.setValueAtTime(600,AC.currentTime);o.frequency.exponentialRampToValueAtTime(900,AC.currentTime+0.1);g.gain.setValueAtTime(0.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.2);o.start();o.stop(AC.currentTime+0.2);}
    else if(type==='die'){o.type='sawtooth';o.frequency.setValueAtTime(300,AC.currentTime);o.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.4);g.gain.setValueAtTime(0.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.4);o.start();o.stop(AC.currentTime+0.4);}
  }catch(e){}
}

let scores=JSON.parse(localStorage.getItem('chuk_scores')||'[]');
document.getElementById('bd').textContent=best;

function init(){
  const w=W(),h=H();
  bird={x:w*0.22,y:h/2-20,vy:0,dead:false,flash:0,wingUp:false,lastJump:0};
  pipes=[];score=0;frame=0;particles=[];
  clouds=[{x:w*0.2,y:60,s:1.0,spd:0.4},{x:w*0.6,y:40,s:0.75,spd:0.3},{x:w*0.85,y:80,s:0.85,spd:0.35}];
  wingAngle=0;
  document.getElementById('sd').textContent='0';
}

function sky(){
  const w=W(),h=H();
  ctx.fillStyle='#0d0d2e';ctx.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){
    const sx=(i*137+frame*0.1)%w, sy=(i*83)%Math.min(h*0.6,350);
    ctx.globalAlpha=(Math.sin(frame*0.04+i)*0.35+0.65)*0.7;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,0.85,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  clouds.forEach(cl=>{
    cl.x-=cl.spd;if(cl.x<-150)cl.x=w+80;
    ctx.save();ctx.globalAlpha=0.12;ctx.fillStyle='#aabbdd';ctx.translate(cl.x,cl.y);ctx.scale(cl.s,cl.s);
    ctx.beginPath();ctx.ellipse(0,0,55,22,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(36,-13,34,17,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-30,-10,28,15,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  // Пол
  ctx.fillStyle='#0c0c26';ctx.fillRect(0,h-55,w,55);
  for(let i=0;i<8;i++){
    const bx=((i*58)+frame*0.4)%(w+40)-20;
    ctx.fillStyle='#171732';ctx.beginPath();ctx.roundRect(bx,h-53,36,53,[3,3,0,0]);ctx.fill();
    if((frame+i*23)%50<25){ctx.fillStyle='rgba(245,200,66,0.18)';ctx.fillRect(bx+4,h-42,11,9);ctx.fillRect(bx+20,h-42,11,9);}
  }
}

function drawBottle(px, pTopH, flipped){
  const h=H();
  ctx.save();
  const bottleH = flipped ? pTopH : (h-55-pTopH-GAP);
  const bottleY = flipped ? 0 : (pTopH+GAP);

  if(flipped){
    ctx.translate(px+PW/2, pTopH);
    ctx.scale(1,-1);
    ctx.translate(-(px+PW/2), 0);
  }

  const x=px, y=bottleY, w=PW, bh=bottleH;
  if(bh<=0){ctx.restore();return;}

  // Тело
  const bodyG=ctx.createLinearGradient(x,0,x+w,0);
  bodyG.addColorStop(0,'rgba(40,160,240,0.5)');
  bodyG.addColorStop(0.25,'rgba(140,220,255,0.72)');
  bodyG.addColorStop(0.55,'rgba(80,190,255,0.65)');
  bodyG.addColorStop(1,'rgba(30,130,210,0.5)');
  ctx.fillStyle=bodyG;
  ctx.strokeStyle='rgba(120,220,255,0.65)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(x+3,y,w-6,bh,[3,3,0,0]);ctx.fill();ctx.stroke();

  // Блик
  const blikG=ctx.createLinearGradient(x+10,0,x+26,0);
  blikG.addColorStop(0,'rgba(255,255,255,0)');
  blikG.addColorStop(0.5,'rgba(255,255,255,0.42)');
  blikG.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=blikG;
  ctx.beginPath();ctx.roundRect(x+10,y+5,16,Math.min(bh-10,bh*0.8),3);ctx.fill();

  // Горизонтальные рёбра жёсткости
  ctx.strokeStyle='rgba(100,200,255,0.18)';ctx.lineWidth=1;
  for(let r=0;r<4;r++){
    const ry=y+bh*0.12+r*(bh*0.22);
    if(ry<y+bh-5){ctx.beginPath();ctx.moveTo(x+3,ry);ctx.lineTo(x+w-3,ry);ctx.stroke();}
  }

  // Этикетка
  if(bh>60){
    const lbY=y+bh*0.22, lbH=Math.min(bh*0.5,bh-bh*0.3);
    const lbG=ctx.createLinearGradient(x+3,0,x+w-3,0);
    lbG.addColorStop(0,'rgba(0,70,180,0.9)');
    lbG.addColorStop(0.5,'rgba(20,120,255,0.95)');
    lbG.addColorStop(1,'rgba(0,70,180,0.9)');
    ctx.fillStyle=lbG;
    ctx.beginPath();ctx.roundRect(x+3,lbY,w-6,lbH,3);ctx.fill();

    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x+3,lbY+lbH*0.33);ctx.lineTo(x+w-3,lbY+lbH*0.33);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+3,lbY+lbH*0.66);ctx.lineTo(x+w-3,lbY+lbH*0.66);ctx.stroke();

    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.font=`bold ${Math.min(11,lbH*0.24)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('AQUA',x+w/2,lbY+lbH*0.32);
    if(lbH>45){
      ctx.font=`${Math.min(9,lbH*0.18)}px sans-serif`;
      ctx.fillStyle='rgba(180,220,255,0.8)';
      ctx.fillText('0.5 L',x+w/2,lbY+lbH*0.6);
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.font=`${Math.min(7,lbH*0.14)}px sans-serif`;
      ctx.fillText('PURE WATER',x+w/2,lbY+lbH*0.82);
    }
    ctx.restore();
  }

  // Горлышко
  const nW=w*0.42, nX=x+(w-nW)/2, nH=Math.min(24,bh*0.1)+2;
  const nG=ctx.createLinearGradient(nX,0,nX+nW,0);
  nG.addColorStop(0,'rgba(40,160,240,0.6)');
  nG.addColorStop(0.5,'rgba(160,230,255,0.82)');
  nG.addColorStop(1,'rgba(40,160,240,0.6)');
  ctx.fillStyle=nG;ctx.strokeStyle='rgba(120,220,255,0.65)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(nX,y-nH,nW,nH+5,[4,4,0,0]);ctx.fill();ctx.stroke();

  // Крышка
  const cW=nW+8, cX=x+(w-cW)/2;
  const cG=ctx.createLinearGradient(cX,0,cX+cW,0);
  cG.addColorStop(0,'#b01800');cG.addColorStop(0.4,'#ff3a18');cG.addColorStop(1,'#b01800');
  ctx.fillStyle=cG;ctx.strokeStyle='#881000';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(cX,y-nH-16,cW,18,[5,5,3,3]);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.beginPath();ctx.roundRect(cX+5,y-nH-13,cW*0.38,7,2);ctx.fill();

  // Резьба на горлышке
  ctx.strokeStyle='rgba(100,200,255,0.3)';ctx.lineWidth=1;
  for(let r=0;r<2;r++){
    ctx.beginPath();ctx.moveTo(nX,y-nH+5+r*6);ctx.lineTo(nX+nW,y-nH+5+r*6);ctx.stroke();
  }

  ctx.restore();
}

function drawBird(){
  const w=W();
  ctx.save();
  ctx.translate(bird.x,bird.y);
  const rot=Math.max(-0.5,Math.min(0.75,bird.vy*0.05));
  ctx.rotate(rot);

  // Крылышко (анимация при прыжке)
  wingAngle+=(bird.vy<0?0.3:-0.15);
  wingAngle=Math.max(-0.6,Math.min(0.3,wingAngle));
  ctx.save();
  ctx.translate(-10,10);
  ctx.rotate(wingAngle);
  ctx.fillStyle='rgba(100,180,100,0.6)';
  ctx.beginPath();ctx.ellipse(-18,0,22,10,0.3,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(bird.flash>0)ctx.globalAlpha=bird.flash%6<3?0.25:1;
  if(img.complete&&img.naturalWidth>0){
    ctx.drawImage(img,-52,-50,104,100);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function spawnParts(x,y){
  for(let i=0;i<22;i++){
    const a=Math.random()*Math.PI*2,sp=2+Math.random()*6;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:3+Math.random()*5,c:`hsl(${Math.random()>0.5?200+Math.random()*40:40+Math.random()*20},80%,65%)`});
  }
}

function drawParts(){
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.22;p.life-=0.02;ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
}

function hit(){
  const cx=bird.x, cy=bird.y;
  const h=H();
  if(cy>h-60||cy<0)return true;
  for(const p of pipes){
    if(cx>p.x+20&&cx<p.x+PW-20){
      if(cy<p.topH+10||cy>p.topH+GAP-10)return true;
    }
  }
  return false;
}
  }
  return false;
}

// Score popup анимация
function showScorePopup(){
  const el=document.getElementById('score-popup');
  el.textContent='+1';
  el.style.opacity='1';
  el.style.transition='none';
  el.style.top='90px';
  requestAnimationFrame(()=>{
    el.style.transition='opacity 0.6s ease,top 0.6s ease';
    el.style.opacity='0';
    el.style.top='50px';
  });
}

function saveScore(s){
  scores.push({s,d:new Date().toLocaleDateString('ru',{day:'numeric',month:'short'})});
  scores.sort((a,b)=>b.s-a.s);
  scores=scores.slice(0,5);
  localStorage.setItem('chuk_scores',JSON.stringify(scores));
}

function renderScores(){
  const medals=['🥇','🥈','🥉'];
  const ranks=['r1','r2','r3','rn','rn'];
  const list=document.getElementById('scores-list');
  if(!scores.length){list.innerHTML='<div class="scores-title">ЕЩЁ НЕТ РЕКОРДОВ</div>';return;}
  list.innerHTML=`<div class="scores-title">ТОП РЕЗУЛЬТАТЫ</div>`+
    scores.map((sc,i)=>`<div class="score-row">
      <div class="score-rank ${ranks[i]}">${i<3?medals[i]:i+1}</div>
      <div class="score-val">${sc.s}</div>
      <div class="score-date">${sc.d}</div>
    </div>`).join('');
}

function shareScore(){
  const txt=`🎮 FLYING CHUK\nМой рекорд: ${score} очков!\nСмогу побить? 🍾`;
  if(navigator.share){navigator.share({title:'Flying Chuk',text:txt}).catch(()=>{});}
  else{navigator.clipboard.writeText(txt).then(()=>{alert('Скопировано! Вставь в чат 📋');}).catch(()=>{alert(txt);});}
}

function die(){
  bird.dead=true;state='dead';
  spawnParts(bird.x,bird.y);
  bird.flash=50;
  playSound('die');
  if(score>best){best=score;localStorage.setItem('chuk_best',best);document.getElementById('bd').textContent=best;}
  saveScore(score);
  document.getElementById('final-score').textContent=score;
  document.getElementById('death-record').textContent=score>=best&&score>0?'🏆 НОВЫЙ РЕКОРД!':'Рекорд: '+best;
  document.getElementById('death-msg').textContent=deaths[Math.floor(Math.random()*deaths.length)];
  renderScores();
  setTimeout(()=>document.getElementById('ov-death').classList.remove('hidden'),900);
}

function loop(){
  const w=W(),h=H();
  ctx.clearRect(0,0,w,h);
  sky();

  if(state==='playing'||state==='dead'){
    frame++;
    if(state==='playing'){
      bird.vy+=GRAV;bird.y+=bird.vy;
      if(frame%PINT===0){
        const minY=90,maxY=h-55-90-GAP;
        const topH=minY+Math.random()*(maxY-minY);
        pipes.push({x:w+10,topH,scored:false});
      }
      pipes.forEach(p=>p.x-=PS);
      pipes=pipes.filter(p=>p.x>-PW-20);
      pipes.forEach(p=>{
        if(!p.scored&&p.x+PW<bird.x){
          p.scored=true;score++;
          document.getElementById('sd').textContent=score;
          showScorePopup();
          playSound('score');
        }
      });
      if(hit()&&!bird.dead) die();
      if(bird.flash>0)bird.flash--;
    }
    pipes.forEach(p=>{drawBottle(p.x,p.topH,true);drawBottle(p.x,p.topH+GAP,false);});
    drawParts();
    drawBird();
  } else if(state==='start'){
    // Анимация чука на старт экране
    bird.y=H()/2-20+Math.sin(frame*0.04)*12;
    bird.vy=Math.sin(frame*0.04)*2;
    frame++;
    drawBird();
  }

  requestAnimationFrame(loop);
}

function startGame(){
  if(AC.state==='suspended')AC.resume();
  document.getElementById('ov-start').classList.add('hidden');
  document.getElementById('ov-death').classList.add('hidden');
  init();
  state='playing';
  playSound('jump');
  bird.vy=JUMP;
}

function jump(){
  if(state==='playing'&&!bird.dead){
    bird.vy=JUMP;
    wingAngle=-0.6;
    playSound('jump');
  }
}

cv.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
cv.addEventListener('click',jump);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});

init();loop();
</script>
