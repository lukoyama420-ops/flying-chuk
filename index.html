// Сохраняем рекорд через CloudStorage
function saveToCloud(score) {
  if (!tg || !tg.CloudStorage) return;
  var key = 'chuk_best';
  tg.CloudStorage.getItem(key, function(err, val) {
    var prev = parseInt(val||'0');
    if (score > prev) {
      tg.CloudStorage.setItem(key, String(score));
    }
  });
}

    tg.sendData(JSON.stringify({action:'score', score:score, name:name}));
  } else {
    navigator.clipboard && navigator.clipboard.writeText(text);
  }
}

// Звуки
var AC;
try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
function beep(freq, dur, type) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.1, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  } catch(e){}
}
function sndJump(){ beep(400,0.1); }
function sndScore(){ beep(600,0.1); beep(800,0.1); }
function sndDie(){ beep(200,0.4,'sawtooth'); }

// Музыка — реальный трек
var bgMusic = null;
var musicStarted = false;
function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  bgMusic = new Audio('music.mp3');
  bgMusic.loop = true;
  bgMusic.volume = 0.5;
  bgMusic.play().catch(function(){});
}

// Константы — точно как Flappy Bird
var GRAV = 0.25;
var JUMP = -5.5;
var PW = 52;       // ширина трубы/бутылки
var GAP = 120;     // зазор между бутылками
var PV = 1.6;      // скорость
var PINT = 1500;   // интервал спавна мс
var GROUND = H - 50; // пол

// Состояние
var state = 'idle'; // idle, play, dead
var bx = 60, by, bvy;
var score, best, pipes, lastPipe, fr, fireTick;
best = parseInt(localStorage.getItem('chuk_best')||'0');

// Огненные частицы
var fireP = [];
function spawnFire() {
  fireTick = 45;
  for (var i=0;i<20;i++) {
    var a = Math.random()*Math.PI*2, sp = 1+Math.random()*3;
    fireP.push({x:W/2, y:38, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2, life:1, s:4+Math.random()*6, h:Math.random()*50});
  }
}

function init() {
  by = H/2 - 50; bvy = 0;
  score = 0; pipes = []; lastPipe = 0; fr = 0; fireTick = 0; fireP = [];
}

function addPipe(t) {
  var mn = 80, mx = GROUND - 80 - GAP;
  var gap_top = mn + Math.random()*(mx-mn); // y где заканчивается верхняя бутылка
  pipes.push({x: W+10, top: gap_top, ok: false});
  lastPipe = t;
}

// Рисуем одну бутылку
// x, y - левый верхний угол, w - ширина, h - высота, flipped - перевёрнутая
function drawOneBottle(x, y, w, h, flipped) {
  if (h <= 2) return;
  ctx.save();
  if (flipped) {
    ctx.translate(x + w/2, y + h/2);
    ctx.scale(1, -1);
    ctx.translate(-(x + w/2), -(y + h/2));
  }

  // Тело бутылки
  var g = ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'rgba(40,155,235,0.52)');
  g.addColorStop(0.3,'rgba(155,225,255,0.8)');
  g.addColorStop(0.65,'rgba(80,185,255,0.7)');
  g.addColorStop(1,'rgba(30,125,215,0.52)');
  ctx.fillStyle = g;
  ctx.strokeStyle = 'rgba(120,215,255,0.75)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.roundRect(x+2, y, w-4, h, [3,3,0,0]);
  ctx.fill(); ctx.stroke();

  // Блик
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(x+7, y+4, 7, Math.min(h-8,50));

  // Этикетка
  if (h > 70) {
    var ly = y + h*0.22, lh = h*0.42;
    ctx.fillStyle = 'rgba(0,80,200,0.88)';
    ctx.beginPath();
    ctx.roundRect(x+2,ly,w-4,lh,3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = 'bold 9px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('AQUA', x+w/2, ly+lh*0.38);
    if (lh > 35) {
      ctx.font = '7px Arial';
      ctx.fillStyle = 'rgba(180,225,255,0.85)';
      ctx.fillText('0.5L', x+w/2, ly+lh*0.65);
    }
  }

  // Горлышко
  var nw = w*0.44, nx = x+(w-nw)/2;
  ctx.fillStyle = 'rgba(70,165,240,0.65)';
  ctx.strokeStyle = 'rgba(120,215,255,0.75)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.roundRect(nx, y-16, nw, 18, [4,4,0,0]);
  ctx.fill(); ctx.stroke();

  // Крышка
  var cw = nw+5, cx2 = x+(w-cw)/2;
  ctx.fillStyle = '#cc2200';
  ctx.beginPath();
  ctx.roundRect(cx2, y-27, cw, 13, [4,4,2,2]);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(cx2+3, y-25, cw*0.35, 5);

  ctx.restore();
}

function drawPipes() {
  for (var i=0; i<pipes.length; i++) {
    var p = pipes[i];
    // Верхняя бутылка: от 0 до p.top, перевёрнутая
    drawOneBottle(p.x, 0, PW, p.top, true);
    // Нижняя бутылка: от p.top+GAP до GROUND, нормальная
    drawOneBottle(p.x, p.top+GAP, PW, GROUND-(p.top+GAP), false);
  }
}

function drawChuk() {
  ctx.save();
  ctx.translate(bx, by);
  var rot = Math.max(-0.4, Math.min(0.6, bvy*0.06));
  ctx.rotate(rot);
  if (img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -19,-17,38,34);
  } else {
    ctx.fillStyle = '#4a9a4a';
    ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBg() {
  ctx.fillStyle = '#0a0a1e';
  ctx.fillRect(0,0,W,H);
  // Звёзды
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (var i=0;i<30;i++) {
    ctx.fillRect((i*137+fr*0.08)%W, (i*97)%360, 1.2, 1.2);
  }
  // Пол
  ctx.fillStyle = '#080818';
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle = '#14143a';
  ctx.fillRect(0,GROUND,W,5);
}

function drawFireParticles() {
  for (var i=fireP.length-1;i>=0;i--) {
    var p = fireP[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=0.025; p.s*=0.96;
    if (p.life<=0){fireP.splice(i,1);continue;}
    var g2 = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s);
    g2.addColorStop(0,'hsla('+(50+p.h)+',100%,90%,'+p.life+')');
    g2.addColorStop(0.5,'hsla('+(25+p.h)+',100%,55%,'+(p.life*0.8)+')');
    g2.addColorStop(1,'hsla('+p.h+',100%,35%,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill();
  }
}

function drawScore() {
  ctx.textAlign = 'center';
  if (fireTick > 0) {
    fireTick--;
    var t = fireTick/45;
    ctx.shadowColor = 'rgba(255,'+(100+Math.floor(t*100))+',0,'+t+')';
    ctx.shadowBlur = 18*t;
    var g3 = ctx.createLinearGradient(W/2-20,20,W/2+20,50);
    g3.addColorStop(0,'rgba(255,255,200,1)');
    g3.addColorStop(0.4,'rgba(255,'+(150+Math.floor(100*t))+',0,1)');
    g3.addColorStop(1,'rgba(220,30,0,1)');
    ctx.font = 'bold 28px Arial';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    ctx.strokeText(score,W/2,46);
    ctx.fillStyle = g3;
    ctx.fillText(score,W/2,46);
    ctx.shadowBlur = 0; ctx.shadowColor='transparent';
  } else {
    ctx.font = 'bold 28px Arial';
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 3;
    ctx.strokeText(score,W/2,46);
    ctx.fillStyle = '#fff';
    ctx.fillText(score,W/2,46);
  }
}

function drawIdle() {
  ctx.fillStyle = 'rgba(0,0,20,0.5)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 38px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('FLYING', W/2, H/2-50);
  ctx.fillStyle = '#f5c842';
  ctx.fillText('CHUK', W/2, H/2-5);
  var pulse = Math.sin(fr*0.07)*0.3+0.7;
  ctx.fillStyle = 'rgba(255,255,255,'+(pulse*0.6)+')';
  ctx.font = '13px Arial';
  ctx.fillText('ТАП ЧТОБЫ НАЧАТЬ', W/2, H/2+32);
  if (best>0){
    ctx.fillStyle='#f5c842';
    ctx.font='bold 12px Arial';
    ctx.fillText('РЕКОРД: '+best,W/2,H/2+56);
  }
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,20,0.6)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(15,15,45,0.96)';
  ctx.beginPath();
  ctx.roundRect(W/2-100,H/2-90,200,195,16);
  ctx.fill();
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.font='11px Arial';
  ctx.fillText('СЧЁТ',W/2,H/2-55);
  ctx.font='bold 46px Arial';
  ctx.fillStyle='#fff';
  ctx.fillText(score,W/2,H/2-10);
  ctx.fillStyle='#f5c842';
  ctx.font='12px Arial';
  if(score>0&&score>=best){
    ctx.fillText('НОВЫЙ РЕКОРД!',W/2,H/2+22);
  } else {
    ctx.fillText('РЕКОРД: '+best,W/2,H/2+22);
  }
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.font='12px Arial';
  ctx.fillText('ТАП ДЛЯ РЕВАНША',W/2,H/2+72);
  // Кнопка поделиться
  ctx.fillStyle='rgba(245,200,66,0.15)';
  ctx.beginPath(); ctx.roundRect(W/2-60,H/2+85,120,28,8); ctx.fill();
  ctx.fillStyle='rgba(245,200,66,0.8)';
  ctx.font='bold 11px Arial';
  ctx.fillText('📤 ПОДЕЛИТЬСЯ',W/2,H/2+104);
}

function checkHit() {
  var cx=bx, cy=by;
  if(cy>GROUND-5||cy<5) return true;
  for(var i=0;i<pipes.length;i++){
    var p=pipes[i];
    if(cx>p.x+6&&cx<p.x+PW-6){
      if(cy<p.top||cy>p.top+GAP) return true;
    }
  }
  return false;
}

function loop(t) {
  fr++;
  ctx.clearRect(0,0,W,H);
  drawBg();

  if(state==='play'){
    bvy+=GRAV; by+=bvy;
    if(t-lastPipe>PINT) addPipe(t);
    for(var i=0;i<pipes.length;i++) pipes[i].x-=PV;
    pipes=pipes.filter(function(p){return p.x>-PW-10;});
    for(var i=0;i<pipes.length;i++){
      var p=pipes[i];
      if(!p.ok&&p.x+PW<bx){
        p.ok=true; score++;
        if(score>best){best=score;localStorage.setItem('chuk_best',best);saveToCloud(best);}
        spawnFire(); sndScore();
      }
    }
    if(checkHit()){ state='dead'; sndDie(); }
  } else if(state==='idle'){
    by=H/2-50+Math.sin(fr*0.05)*8;
  }

  drawPipes();
  drawFireParticles();
  drawChuk();
  if(state==='play') drawScore();
  if(state==='idle') drawIdle();
  if(state==='dead') drawDead();

  requestAnimationFrame(loop);
}

function jump(){
  if(AC&&AC.state==='suspended') AC.resume();
  // Проверяем клик на кнопку поделиться
  if(state==='dead') {
    // кнопка поделиться в нижней части карточки
    shareResult(score);
  }
  if(state==='idle'||state==='dead'){
    init(); state='play'; bvy=JUMP;
    startMusic(); sndJump();
  } else if(state==='play'){
    bvy=JUMP; sndJump();
  }
}

document.addEventListener('touchstart',function(e){e.preventDefault();jump();},{passive:false});
document.addEventListener('click',jump);
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
